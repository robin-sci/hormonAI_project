    <script>
      (function () {
        var FID = "04-merge";
        var byId = function (s) {
          return document.getElementById(FID + "-" + s);
        };
        var all = function (s) {
          return Array.prototype.slice.call(
            document.querySelectorAll('[class~="' + FID + "-" + s + '"]'),
          );
        };

        var tl = gsap.timeline({ paused: true });

        /* ---------- Scene 1 (0.0-1.2s): rail advances, title, lanes dim ---------- */
        // "1 Search" active -> done outline
        tl.fromTo(byId("pill1-fill"), { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power2.in" }, 0.25);
        tl.fromTo(
          byId("pill1"),
          { backgroundColor: "#fdfae7" },
          { backgroundColor: "rgba(30,43,250,0.08)", duration: 0.35, ease: "power1.out" },
          0.35,
        );
        tl.fromTo(byId("pill1-label"), { color: "#fdfae7" }, { color: "#1e2bfa", duration: 0.3, ease: "none" }, 0.3);
        // connector Search -> Merge fills, then "2 Merge" fills cobalt
        tl.fromTo(byId("seg1"), { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 0.45);
        tl.fromTo(byId("pill2-fill"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.75);
        tl.fromTo(byId("pill2-label"), { color: "#6b6b6b" }, { color: "#fdfae7", duration: 0.25, ease: "none" }, 0.8);

        // step title
        tl.fromTo(
          byId("title"),
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          0.15,
        );

        // lanes already in place -> dim to ~40%
        tl.fromTo(byId("lanes"), { opacity: 1 }, { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 0.2);

        // empty merged column establishes (hero region visible early)
        tl.fromTo(
          all("slot"),
          { opacity: 0, x: 24 },
          { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 },
          0.3,
        );

        /* ---------- Scene 2 (1.2-4.6s): matching chips glow, fly, merge ---------- */
        var ghosts = all("ghost");
        var halos = all("halo");
        // glow in each lane where the hit appears
        tl.fromTo(
          ghosts,
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", stagger: 0.12 },
          1.2,
        );
        tl.fromTo(
          halos,
          { opacity: 0.9, scale: 1 },
          { opacity: 0, scale: 1.45, duration: 0.8, ease: "power2.out", stagger: 0.12 },
          1.25,
        );

        // all copies fly right into the #1 slot (landing side by side in the bundle)
        var deltas = [
          [1043, 9],
          [1045, -111],
          [1363, -231],
          [1207, -351],
        ];
        tl.fromTo(
          byId("out"),
          { opacity: 0, scale: 0.96 },
          { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
          1.95,
        );
        ghosts.forEach(function (g, i) {
          tl.fromTo(
            g,
            { x: 0, y: 0 },
            { x: deltas[i][0], y: deltas[i][1], duration: 0.8, ease: "power3.inOut" },
            1.95 + i * 0.1,
          );
        });

        // scale-swap: the bundle (+ copies) shrinks out, ONE merged chip pops in
        var TRIGGER = 3.05;
        var EXIT_DUR = 0.35;
        var OVERLAP = 0.15;
        tl.to(
          [byId("out")].concat(ghosts),
          { scale: 0.7, opacity: 0, duration: EXIT_DUR, ease: "power2.in" },
          TRIGGER,
        );
        tl.fromTo(
          byId("top"),
          { scale: 0.7, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" },
          TRIGGER + EXIT_DUR - OVERLAP,
        );
        // inner content reveals after the incoming settles
        tl.fromTo(
          byId("top-q"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
          TRIGGER + EXIT_DUR + 0.25,
        );

        // four more chips settle below as #2-#5 (staggered cascade)
        tl.fromTo(
          all("row"),
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 },
          3.95,
        );

        /* ---------- Scene 3 (4.6-7.0s): line per-word, formula types in, hold ---------- */
        tl.fromTo(
          all("word"),
          { opacity: 0, y: 14 },
          { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", stagger: 0.035 },
          4.6,
        );
        tl.fromTo(
          byId("formula"),
          { opacity: 0, scale: 0.94 },
          { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", transformOrigin: "0% 50%" },
          4.95,
        );
        all("ch").forEach(function (c, i) {
          tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.02 + i * 0.017);
        });

        // hold: alive but resting - slow push-in on the merged column
        tl.fromTo(byId("col"), { scale: 1 }, { scale: 1.015, duration: 2.4, ease: "sine.inOut" }, 4.6);

        // pad the timeline to the full frame length
        tl.set({}, {}, 7);

        window.__timelines = window.__timelines || {};
        window.__timelines["04-merge"] = tl;
      })();
    </script>
  </div>
</template>
