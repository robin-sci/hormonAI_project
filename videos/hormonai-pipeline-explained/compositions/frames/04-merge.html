      tl.fromTo(
        byId("pill-1"),
        { backgroundColor: "#1e2bfa", color: "#fdfae7", borderColor: "rgba(30,43,250,1)" },
        {
          backgroundColor: "#ebe9e8", // opaque 8% cobalt tint on cream (hides the rail line)
          color: "#1e2bfa",
          borderColor: "rgba(30,43,250,0.2)",
          duration: 0.4,
          ease: "power1.out",
        },
        0.2,
      );
      tl.fromTo(
        byId("pill-2"),
        { backgroundColor: "#fdfae7", color: "#6b6b6b", borderColor: "rgba(30,43,250,0.2)" },
        { backgroundColor: "#1e2bfa", color: "#fdfae7", borderColor: "rgba(30,43,250,1)", duration: 0.4, ease: "power1.out" },
        0.5,
      );
      tl.fromTo(
        byId("title"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.2,
      );

      // lanes (already in place) slide together toward the middle band and dim to ~40%
      tl.fromTo(
        lanes,
        { scale: 1 },
        { scale: LANE_SCALE, duration: 0.9, ease: "power3.inOut", stagger: 0.04 },
        0.15,
      );
      const dimmed = []
        .concat(cls(lanesWrap, "lane-bg"))
        .concat(cls(lanesWrap, "lane-label"))
        .concat(cls(lanesWrap, "skel"))
        .concat(cls(lanesWrap, "end"))
        .concat(hits);
      tl.fromTo(dimmed, { opacity: 1 }, { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 0.2);
      tl.fromTo(byId("conns"), { opacity: 1 }, { opacity: 0.4, duration: 0.8, ease: "power2.inOut" }, 0.2);

      // empty merged column establishes on the right (hero region visible early)

        cls(layer, "slot"),
        { opacity: 0, x: 24 },
        { opacity: 1, x: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 },

      );

      /* ---------- Scene 2 (1.2–4.6s): matching chips glow, fly right, merge into ONE #1 ---------- */
      // glow cobalt in each lane they appear in
      tl.fromTo(
        hits,
        { backgroundColor: "rgba(30,43,250,0.15)", borderColor: "rgba(30,43,250,0.2)" },
        {
          opacity: 1,
          backgroundColor: "#1e2bfa",
          borderColor: "rgba(30,43,250,1)",
          duration: 0.35,
          ease: "power2.out",
          stagger: 0.12,
        },
        1.2,
      );
      tl.fromTo(
        hits.reduce((acc, h) => acc.concat(Array.from(h.querySelectorAll("i, span"))), []),
        { color: (i) => (i % 2 === 0 ? "#1e2bfa" : "#111111") },
        { color: "#fdfae7", duration: 0.3, ease: "none", stagger: 0.06 },
        1.2,
      );
      tl.fromTo(
        hits,
        { scale: 1 },
        { scale: 1.12, duration: 0.25, ease: "power2.out", stagger: 0.12 },
        1.25,
      );

      // fly: every copy travels to the #1 slot (stacked), measured from layout (transform-free)
      const SLOT_CX = 1552;
      const SLOT_CY = 340;
      const STACK = [-15, -5, 5, 15];
      const EST_HIT_W = 514;
      lanes.forEach((lane, i) => {
        const hit = hits[i];
        const k = Number(lane.getAttribute("data-hit"));
        const w = hit.offsetWidth || EST_HIT_W;
        const ol = hit.offsetWidth ? hit.offsetLeft : 21.5 + k * 108;
        const ot = hit.offsetWidth ? hit.offsetTop : 58;
        // chip centre in page coords before the lane scale
        const cx0 = LANE_LEFT + 1.5 + ol + w / 2;
        const cy0 = LANE_TOPS[i] + 1.5 + ot + 26;
        // after the lane scales about its left-centre
        const oy = LANE_TOPS[i] + 63;
        const cx = LANE_LEFT + (cx0 - LANE_LEFT) * LANE_SCALE;
        const cy = oy + (cy0 - oy) * LANE_SCALE;
        // translate in the lane's (scaled) local space
        const dx = (SLOT_CX - cx) / LANE_SCALE;
        const dy = (SLOT_CY + STACK[i] - cy) / LANE_SCALE;
        tl.fromTo(
          hit,
          { x: 0, y: 0 },
          { x: dx, y: dy, duration: 0.8, ease: "power3.inOut" },
          1.95 + i * 0.1,
        );
      });
      tl.fromTo(
        byId("out"),
        { opacity: 0, scale: 0.96 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "power2.out" },
        2.0,
      );

      // scale-swap: the bundle + copies shrink out (power2.in), ONE merged chip pops in (back.out)
      const TRIGGER = 3.05;
      const EXIT_DUR = 0.35;
      const OVERLAP = 0.15;
      tl.to(byId("out"), { scale: 0.7, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);
      tl.to(hits, { scale: 0.7 * 1.12, opacity: 0, duration: EXIT_DUR, ease: "power2.in" }, TRIGGER);
      tl.fromTo(
        byId("top"),
        { scale: 0.7, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" },
        TRIGGER + EXIT_DUR - OVERLAP,
      );
      // inner content reveals after the incoming settles
      tl.fromTo(
        byId("top-q"),
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
        TRIGGER + EXIT_DUR + 0.25,
      );

      // four more chips settle below as #2–#5 (staggered cascade)
      tl.fromTo(
        cls(layer, "row"),
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power3.out", stagger: 0.12 },
        3.95,
      );

      /* ---------- Scene 3 (4.6–7.0s): line per-word, formula types in, hold ---------- */
      tl.fromTo(
        cls(layer, "word"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.32, ease: "power3.out", stagger: 0.035 },
        4.6,
      );
      tl.fromTo(
        byId("formula"),
        { opacity: 0, scale: 0.94 },
        { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out", transformOrigin: "0% 50%" },
        4.95,
      );
      cls(layer, "ch").forEach((c, i) => {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, 5.02 + i * 0.017);
      });

      // hold: alive but resting — slow push-in on the merged column
      tl.fromTo(
        [byId("colA"), byId("colB")],
        { scale: 1 },
        { scale: 1.015, duration: 2.4, ease: "sine.inOut" },
        4.6,
      );

      tl.set({}, {}, 7);
      window.__timelines["04-merge"] = tl;
    })();
  </script>
</template>
