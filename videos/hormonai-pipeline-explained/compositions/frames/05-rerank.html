  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var root = document.querySelector('[data-composition-id="05-rerank"]');
      var byId = function (id) { return root.querySelector('[id="' + id + '"]'); };
      var tl = gsap.timeline({ paused: true });

      var COBALT = "#1e2bfa", CREAM = "#fdfae7";
      var SLOT = 132;                       // card pitch (112 + 20 gap)
      var SCORES = [0.92, 0.38, 0.66, 0.22, 0.30]; // relevance bar lengths (visual only)
      var NEW_SLOT = [0, 2, 1, 4, 3];       // order after rerank, by bar length

      var cards = [], fills = [], texts = [], tracks = [], paths = [];
      for (var i = 0; i < 5; i++) {
        var c = byId("05-rerank-card" + i);
        cards.push(c);
        fills.push(c.querySelector(".\\30 5-rerank-fill"));
        texts.push(c.querySelector(".\\30 5-rerank-ct"));
        tracks.push(c.querySelector(".\\30 5-rerank-track"));
        var p = byId("05-rerank-path" + i);
        var len = p.getTotalLength();
        p.style.strokeDasharray = len;
        p.style.strokeDashoffset = len;
        paths.push({ el: p, len: len });
      }
      var lens = byId("05-rerank-lens");
      var top1 = byId("05-rerank-top");

      // ---------- Scene 1 (0.0–1.2s): rail advances, title, chips morph into cards ----------
      tl.fromTo(byId("05-rerank-p2"), { backgroundColor: COBALT, color: CREAM },
        { backgroundColor: CREAM, color: COBALT, duration: 0.45, ease: "power2.inOut" }, 0.1);
      tl.fromTo(byId("05-rerank-p3"), { backgroundColor: CREAM, color: "#9a9a9a", borderColor: "rgba(30,43,250,0.2)" },
        { backgroundColor: COBALT, color: CREAM, borderColor: COBALT, duration: 0.45, ease: "power2.inOut" }, 0.3);
      tl.fromTo(byId("05-rerank-railfill"), { scaleX: 0.25 }, { scaleX: 0.5, duration: 0.6, ease: "power2.inOut" }, 0.1);

      tl.fromTo(byId("05-rerank-title"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.fromTo(byId("05-rerank-q"), { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.05);
      tl.fromTo(byId("05-rerank-qdot"), { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, 0.45);

      // card-morph-anchor: pill chips (half size, full pill radius, deeper tint) grow into tinted cards
      cards.forEach(function (c, k) {
        var t = 0.15 + k * 0.08;
        tl.fromTo(c,
          { opacity: 0, x: -36, scale: 0.5, borderRadius: 112, backgroundColor: "#dcdbea" },
          { opacity: 1, x: 0, scale: 1, borderRadius: 14, backgroundColor: "#f4f2e8",
            duration: 0.85, ease: "power2.inOut" }, t);
        tl.fromTo(tracks[k], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, t + 0.55);
      });

      // ---------- Scene 2 (1.2–4.8s): reading bracket pairs question with each card; bars fill ----------
      tl.fromTo(root.querySelectorAll(".\\30 5-rerank-w"), { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 }, 1.25);

      tl.fromTo(lens, { opacity: 0, y: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power2.out" }, 1.3);

      var READ0 = 1.45, READ_STEP = 0.65;
      for (var j = 0; j < 5; j++) {
        var t0 = READ0 + j * READ_STEP;
        if (j > 0) {
          tl.to(lens, { y: j * SLOT, duration: 0.28, ease: "power2.inOut" }, t0 - 0.1);
          tl.to(paths[j - 1].el, { opacity: 0, duration: 0.2, ease: "power1.in" }, t0 - 0.1);
        }
        tl.fromTo(paths[j].el, { strokeDashoffset: paths[j].len, opacity: 1 },
          { strokeDashoffset: 0, duration: 0.25, ease: "power2.out" }, t0);
        tl.fromTo(fills[j], { scaleX: 0 }, { scaleX: SCORES[j], duration: 0.45, ease: "power2.out" }, t0 + 0.12);
      }
      var readEnd = READ0 + 4 * READ_STEP + 0.6;  // ~4.65s
      tl.to(lens, { opacity: 0, duration: 0.2, ease: "power1.in" }, readEnd);
      tl.to(paths[4].el, { opacity: 0, duration: 0.2, ease: "power1.in" }, readEnd);

      // ---------- Scene 3 (4.8–7.0s): reorder by bar length; winner lifts to #1 ----------
      var RE = 4.85;
      cards.forEach(function (c, k) {
        var dy = (NEW_SLOT[k] - k) * SLOT;
        if (dy !== 0) tl.to(c, { y: dy, duration: 0.8, ease: "power2.inOut" }, RE);
      });
      tl.to(cards[0], { scale: 1.025, borderColor: COBALT, backgroundColor: "#ebe9e8",
        duration: 0.6, ease: "power2.out" }, RE + 0.2);
      tl.fromTo(top1, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, RE + 0.55);
      tl.to(cards.slice(1), { opacity: 0.45, duration: 0.5, ease: "power1.out" }, RE + 0.75);

      // pad to the fixed 7s duration (hold)
      tl.set({}, {}, 7);

      window.__timelines["05-rerank"] = tl;
    })();
