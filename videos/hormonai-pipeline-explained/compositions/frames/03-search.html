  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const byId = (id) => document.getElementById(id);
      const cls = (scope, name) =>
        Array.from(scope.querySelectorAll('[class~="f03-search-' + name + '"]'));

      const stage = byId("f03-search-stage");
      const layerRoot = stage.parentNode;
      const railLine = byId("f03-search-rail-line");
      const pills = cls(layerRoot, "pill");
      const pill1 = byId("f03-search-pill-1");
      const title = byId("f03-search-title");
      const tag = byId("f03-search-tag");
      const qcard = byId("f03-search-qcard");
      const conns = cls(stage, "conn");
      const lanes = cls(stage, "lane");

      // svg-path-draw setup: measured lengths
      [railLine].concat(conns).forEach((p) => {
        const len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });

      /* Scene 1 (0.0–1.4s): rail draws, pill 1 fills, title, question card */
      tl.to(railLine, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0.05);
      tl.fromTo(
        pills,
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out", stagger: 0.1 },
        0.05,
      );
      tl.fromTo(
        pill1,
        { backgroundColor: "#fdfae7", color: "#6b6b6b", borderColor: "rgba(30,43,250,0.2)" },
        {
          backgroundColor: "#1e2bfa",
          color: "#fdfae7",
          borderColor: "rgba(30,43,250,1)",
          duration: 0.4,
          ease: "power1.out",
        },
        0.65,
      );
      tl.fromTo(
        title,
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.25,
      );
      // empty lane slots established early (faint), they light up on their cue
      tl.fromTo(
        lanes,
        { opacity: 0 },
        { opacity: 0.3, duration: 0.5, ease: "power1.out", stagger: 0.06 },
        0.3,
      );
      tl.fromTo(
        qcard,
        { opacity: 0, x: -60 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        0.6,
      );

      /* Scene 2 (1.4–5.6s): one lane per ~1s — connector draws, lane lights, chips cascade */
      lanes.forEach((lane, i) => {
        const t0 = 1.4 + i * 1.0;
        const label = cls(lane, "lane-label")[0];
        const chips = cls(lane, "chip");
        tl.to(conns[i], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, t0);
        tl.to(lane, { opacity: 1, duration: 0.3, ease: "power1.out" }, t0 + 0.3);
        tl.fromTo(
          label,
          { opacity: 0, x: -14 },
          { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" },
          t0 + 0.32,
        );
        tl.fromTo(
          chips,
          { opacity: 0, x: -18, scale: 0.94 },
          { opacity: 1, x: 0, scale: 1, duration: 0.32, ease: "power2.out", stagger: 0.08 },
          t0 + 0.45,
        );
      });

      /* Scene 3 (5.6–8.0s): "top 40" lane ends + tag, slow push-in hold */
      const ends = cls(stage, "end");
      tl.fromTo(
        ends,
        { opacity: 0, x: -10 },
        { opacity: 1, x: 0, duration: 0.35, ease: "power1.out", stagger: 0.08 },
        5.6,
      );
      tl.fromTo(
        tag,
        { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        5.85,
      );
      tl.fromTo(stage, { scale: 1 }, { scale: 1.012, duration: 2.4, ease: "sine.inOut" }, 5.6);

      window.__timelines["03-search"] = tl;
    })();
  </script>
