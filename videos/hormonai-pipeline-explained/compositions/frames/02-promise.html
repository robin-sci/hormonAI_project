  </style>

  <div id="root" data-composition-id="02-promise" data-width="1920" data-height="1080">
    <div id="frame-02-promise-ground" class="02-promise-ground clip" data-start="0" data-duration="7" data-track-index="0"></div>

    <div id="frame-02-promise-stage" class="02-promise-stage clip" data-start="0" data-duration="7" data-track-index="1">
      <!-- Scene 1: wordmark (supporting, upper-left) -->
      <div class="02-promise-brand">
        <div class="02-promise-accent"></div>
        <div class="02-promise-wordmark">hormon<span>AI</span></div>
      </div>

      <!-- Scene 2: fanned FAQ card stack (focal) -->
      <div class="02-promise-fan">
        <div class="02-promise-card" data-target-x="-120" data-target-y="-160" data-target-r="-3">
          <div class="02-promise-bar" style="width: 62%"></div>
        </div>
        <div class="02-promise-card" data-target-x="-60" data-target-y="-80" data-target-r="-1.5">
          <div class="02-promise-bar" style="width: 48%"></div>
        </div>
        <div class="02-promise-card" data-target-x="0" data-target-y="0" data-target-r="0">
          <div class="02-promise-bar" style="width: 70%"></div>
        </div>
        <div class="02-promise-card" data-target-x="60" data-target-y="80" data-target-r="1">
          <div class="02-promise-q">Can I eat grapefruit?</div>
        </div>
        <div class="02-promise-card" data-target-x="120" data-target-y="160" data-target-r="2">
          <div class="02-promise-q">How long do I need to take hormone therapy?</div>
        </div>
      </div>

      <div class="02-promise-metric">
        <div class="02-promise-count-wrap"><span class="02-promise-count">0</span></div>
        <div class="02-promise-count-label">vetted FAQ answers</div>
      </div>
      <div class="02-promise-pills">
        <div class="02-promise-pill">EN 111</div>
        <div class="02-promise-pill">FR 69</div>
      </div>

      <!-- Scene 3: the promise (left) -->
      <div class="02-promise-claim">
        <div class="02-promise-headline"><span class="02-promise-word">Answers</span><span class="02-promise-word">only</span><span class="02-promise-word">from</span><span class="02-promise-word">these.</span></div>
        <div class="02-promise-otherwise">Otherwise:</div>
        <div class="02-promise-decline">&ldquo;Please ask your oncology team.&rdquo;</div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const FID = "02-promise";
      const root = document.querySelector('[data-composition-id="' + FID + '"]');
      const q = (name) => Array.from(root.querySelectorAll("." + CSS.escape(FID + "-" + name)));
      const one = (name) => q(name)[0];

      const tl = gsap.timeline({ paused: true });

      // ── Scene 1 (0.0–1.6s): wordmark slide-up crossfade into the upper-left ──
      tl.fromTo(one("accent"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0.1);
      tl.fromTo(one("wordmark"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, 0.2);

      // ── Scene 2 (1.6–3.6s): FAQ cards expand outward from one shared center ──
      const ENTRY_AT = 1.6, EXPAND_DUR = 1.2, STAGGER = 0.07, START_PROGRESS = 0.25;
      q("card").forEach((el, i) => {
        const tx = Number(el.dataset.targetX);
        const ty = Number(el.dataset.targetY);
        const tr = Number(el.dataset.targetR);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: tx * START_PROGRESS, y: ty * START_PROGRESS, rotation: 0, scale: 0.6, opacity: 0 },
          { xPercent: -50, yPercent: -50, x: tx, y: ty, rotation: tr, scale: 1, opacity: 1, duration: EXPAND_DUR, ease: "power3.out" },
          ENTRY_AT + i * STAGGER
        );
      });

      // "180" counts up while its scale grows (shared duration + ease)
      const COUNT_AT = 1.8, COUNT_DUR = 1.4, COUNT_EASE = "power3.out";
      const counter = one("count");
      const state = { value: 0 };
      tl.fromTo(
        state,
        { value: 0 },
        {
          value: 180,
          duration: COUNT_DUR,
          ease: COUNT_EASE,
          onUpdate: () => { counter.textContent = String(Math.round(state.value)); },
        },
        COUNT_AT
      );
      tl.fromTo(counter, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: COUNT_DUR, ease: COUNT_EASE }, COUNT_AT);
      tl.fromTo(one("count-label"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.1);

      // EN / FR pills fade in beneath once the count lands
      tl.fromTo(q("pill"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", stagger: 0.12 }, 3.15);

      // ── Scene 3 (3.6–5.0s): the promise, per-word, then the decline ──
      tl.fromTo(q("word"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.1 }, 3.6);
      tl.fromTo(one("otherwise"), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" }, 4.2);
      tl.fromTo(one("decline"), { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.45);

      // ── Scene 4 (5.0–7.0s): held read — everything still ──
      tl.set({}, {}, 7);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
  </script>
